[project]
name = "fx-macro-platform"
version = "0.1.0"
description = "Point-in-time FX/macro data platform: fetch -> immutable raw -> Postgres -> dbt -> FastAPI."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "requests>=2.32",
    "fredapi>=0.5.2",
    "psycopg[binary]>=3.1",
    "dbt-postgres>=1.9.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "dagster>=1.13.21",
    "dagster-webserver>=1.13.21",
    "dagster-dbt>=0.29.21",
    "dagster-postgres>=0.29.21",
    "elementary-data>=0.16,<0.20",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingest", "api", "orchestration", "orchestration.assets"]

[tool.dagster]
module_name = "orchestration.definitions"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
