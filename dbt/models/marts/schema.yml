version: 2

models:
  - name: fct_macro_observation
    description: "Bitemporal fact. Grain (series_id, obs_date, known_at)."
    columns:
      - name: observation_key
        description: "Surrogate key over the fact grain."
        tests: [unique, not_null]
      - name: series_id
        tests: [not_null]
      - name: obs_date
        tests: [not_null]
      - name: known_at
        tests: [not_null]
      - name: value
        tests: [not_null]

  - name: fct_macro_observation_latest
    description: "Latest-vintage view; one row per (series_id, obs_date)."
    columns:
      - name: series_obs_key
        description: "Surrogate key over (series_id, obs_date)."
        tests: [unique, not_null]
      - name: series_id
        tests: [not_null]
      - name: obs_date
        tests: [not_null]
      - name: value
        tests: [not_null]

  - name: dim_series
    description: "Series catalog dimension (from the series_catalog seed)."
    columns:
      - name: series_id
        tests: [unique, not_null]

  - name: fct_macro_series_grains
    description: >
      Resampled series mart: one row per (series_id, grain, period_date) with
      last-observation-in-period (asof) values. Grains: day (calendar-filled,
      daily series only), week (ISO Monday buckets), month, quarter, year —
      never finer than the series' native frequency.
    config:
      post-hook:
        - "create unique index if not exists ux_macro_series_grains on marts.fct_macro_series_grains (series_id, grain, period_date)"
        - "analyze marts.fct_macro_series_grains"
    columns:
      - name: series_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_series')
              field: series_id
      - name: grain
        tests:
          - not_null
          - accepted_values:
              values: [day, week, month, quarter, year]
      - name: period_date
        tests: [not_null]
      - name: value
        tests: [not_null]

  - name: fct_macro_series_transforms
    description: >
      Long-format transforms mart: one row per (series_id, grain, period_date,
      transform) with the precomputed level, diff, pct_change, log_level,
      log_return, index_100 (base = series inception) and zscore (full-history
      mean/stddev). STL components are excluded — Loess has no SQL equivalent —
      and remain runtime-computed by the dashboard.
    config:
      post-hook:
        - "create index if not exists ix_macro_series_transforms_lookup on marts.fct_macro_series_transforms (series_id, grain, transform, period_date)"
        - "analyze marts.fct_macro_series_transforms"
    columns:
      - name: series_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_series')
              field: series_id
      - name: grain
        tests:
          - not_null
          - accepted_values:
              values: [day, week, month, quarter, year]
      - name: period_date
        tests: [not_null]
      - name: transform
        tests:
          - not_null
          - accepted_values:
              values: [level, diff, pct_change, log_level, log_return, index_100, zscore]
      - name: value
        tests: [not_null]

  - name: fct_macro_series_period_metrics
    description: >
      Period-metrics mart: one row per (series_id, grain, period_date) with the
      level plus MoM (period-over-period), QoQ, YoY, MTD and YTD % changes using
      grain-aware offsets (week: 52-week YoY / 13-week QoQ; day joins clamped
      calendar dates; MTD/YTD anchor on the last period before the current
      month/year).
    config:
      post-hook:
        - "create unique index if not exists ux_macro_series_period_metrics on marts.fct_macro_series_period_metrics (series_id, grain, period_date)"
        - "analyze marts.fct_macro_series_period_metrics"
    columns:
      - name: series_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_series')
              field: series_id
      - name: grain
        tests:
          - not_null
          - accepted_values:
              values: [day, week, month, quarter, year]
      - name: period_date
        tests: [not_null]
      - name: value
        tests: [not_null]
      - name: mom_pct
        description: "% change vs the previous period."
      - name: qoq_pct
        description: "% change vs three months / thirteen weeks earlier."
      - name: yoy_pct
        description: "% change vs one year / 52 weeks earlier."
      - name: mtd_pct
        description: "% change vs the last period before the current month."
      - name: ytd_pct
        description: "% change vs the last period before the current year."

  - name: fct_ecb_meeting_probabilities
    description: >
      Market-implied ECB rate probabilities from the official euro OIS curve
      (ECB MMSR buckets), using the CME-FedWatch decomposition: interpolate the
      OIS curve to the midpoint of each reserve maintenance period, difference
      consecutive period rates into 25bp steps, then convolve the per-meeting
      splits into a distribution of the rate level after each meeting. Grain is
      (meeting_date, scenario_rate) and the probabilities of a meeting sum to 1.
      Indicative, not tradeable — MMSR bucket averages lag live pricing by
      roughly six to eight weeks; check `staleness_days` on every row.
    columns:
      - name: engine
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['local_ois']
      - name: meeting_date
        tests: [not_null]
      - name: scenario_rate
        description: "Candidate deposit facility rate after this meeting, in percent."
        tests: [not_null]
      - name: probability
        description: "Probability mass on this rate level after this meeting (fraction)."
        tests: [not_null]
      - name: expected_change_bp
        description: "Expected policy change at this meeting implied by the curve, in bp."
      - name: prob_higher_step
        description: "Probability the meeting lands on the upper of the two adjacent 25bp steps."
      - name: current_rate
        description: "Deposit facility rate the engine anchored on."
      - name: curve_as_of
        description: "Newest OIS observation backing the curve — the real freshness clock."
        tests: [not_null]
      - name: staleness_days
        description: "Days between the curve snapshot and the build date."
      - name: period_ois_rate
        description: "Interpolated OIS rate for the maintenance period the meeting opens."

  - name: fct_ecb_probability_crosscheck
    description: >
      The local OIS-implied engine scored against ecb-watch.eu, which prices
      dated €STR futures. Grain (meeting_date, scenario_rate). `diff_pp` is local
      minus ecb-watch in percentage points; `total_variation_pp` is
      0.5 * sum(|Δ|) over the meeting — the total probability mass that would
      have to move to turn one distribution into the other, i.e. the headline
      accuracy metric for the local engine. `matched = false` marks scenarios
      priced by only one of the two engines, which is itself a finding: usually
      the official curve is too stale to see a scenario the futures market
      already prices.
    columns:
      - name: meeting_date
        tests: [not_null]
      - name: scenario_rate
        tests: [not_null]
      - name: diff_pp
        description: "local minus ecb-watch, in percentage points."
      - name: total_variation_pp
        description: "Total variation distance between the two distributions, in points."
      - name: matched
        description: "True when both engines price this scenario."
        tests: [not_null]
      - name: source_version
        description: "ecb-watch feed version (their `metadata.version`)."
      - name: source_last_updated
        description: "ecb-watch's own last-updated stamp — how fresh the cross-check is."
