version: 2

sources:
  - name: raw
    description: "Append-only fetch-level landing (spec §5). One row per fetch event."
    schema: raw
    tables:
      - name: source_fetch
        description: >
          One row per (source, resource, fetched_at). Byte-faithful: payload is the
          parsed-to-JSON body, payload_raw the original bytes, payload_sha256 the
          digest. Observations are extracted in staging from `payload`.
