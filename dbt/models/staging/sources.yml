version: 2

sources:
  - name: raw
    description: "Append-only, point-in-time FRED observations landed by the loader."
    schema: main
    tables:
      - name: raw_observations
        description: >
          One row per (source, series_id, reference_period, fetch_timestamp).
          Immutable: re-fetches append new fetch_timestamp rows, never updates.
