version: 2

models:
  - name: stg_fred__observations
    description: "Typed observations parsed from FRED fetch payloads."
    columns:
      - name: series_id
        tests: [not_null]
      - name: obs_date
        tests: [not_null]
      - name: known_at
        tests: [not_null]
      - name: fetched_at
        tests: [not_null]

  - name: stg_ecb__observations
    description: "Typed observations parsed from ECB SDW fetch payloads."
    columns:
      - name: series_id
        tests: [not_null]
      - name: obs_date
        tests: [not_null]
      - name: known_at
        tests: [not_null]
      - name: fetched_at
        tests: [not_null]

  - name: stg_bundesbank__observations
    description: "Typed observations parsed from Bundesbank BBSSY fetch payloads."
    columns:
      - name: series_id
        tests: [not_null]
      - name: obs_date
        tests: [not_null]
      - name: known_at
        tests: [not_null]
      - name: fetched_at
        tests: [not_null]
