version: 2

models:
  - name: stg_fred__observations
    description: "Typed 1:1 view over the raw point-in-time table."
    columns:
      - name: observation_key
        description: "Surrogate key over the raw grain — uniqueness contract."
        tests:
          - unique
          - not_null
      - name: series_id
        tests: [not_null]
      - name: reference_period
        tests: [not_null]
      - name: fetch_timestamp
        tests: [not_null]
