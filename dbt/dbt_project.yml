name: "fx_macro"
version: "0.2.0"
config-version: 2

profile: "fx_macro"

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]

target-path: "target"
clean-targets: ["target", "dbt_packages", "logs"]

models:
  fx_macro:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: view
    marts:
      +schema: marts
      +materialized: table
  elementary:
    +schema: elementary

seeds:
  fx_macro:
    +schema: meta

# Elementary (spec §9): persist dbt artifacts/test results on every build, and
# let Elementary's overridden dbt macros (e.g. test materialization) take effect.
on-run-end:
  - "{{ elementary.upload_dbt_artifacts() }}"

dispatch:
  - macro_namespace: dbt
    search_order: ["elementary", "dbt"]
