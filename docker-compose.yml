services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-warehouse}
      PLATFORM_WRITER_PASSWORD: ${PLATFORM_WRITER_PASSWORD:-writer_dev}
      PLATFORM_READER_PASSWORD: ${PLATFORM_READER_PASSWORD:-reader_dev}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"   # 5433: host has a local Postgres on 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-warehouse}"]
      interval: 10s
      timeout: 5s
      retries: 5

  dagster-webserver:
    build: { context: ., dockerfile: Dockerfile }
    image: fx-macro-platform:latest
    command: dagster-webserver -h 0.0.0.0 -p 3000
    depends_on:
      postgres: { condition: service_healthy }
    environment: &dagster-env
      FRED_API_KEY: ${FRED_API_KEY:-}
      FX_FETCH_MODE: ${FX_FETCH_MODE:-synthetic}
      FX_HISTORY_START: ${FX_HISTORY_START:-2024-01-01}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: warehouse
      DAGSTER_POSTGRES_DB: dagster
      PLATFORM_WRITER_USER: platform_writer
      PLATFORM_WRITER_PASSWORD: ${PLATFORM_WRITER_PASSWORD:-writer_dev}
      PLATFORM_READER_USER: platform_reader
      PLATFORM_READER_PASSWORD: ${PLATFORM_READER_PASSWORD:-reader_dev}
      DAGSTER_HOME: /opt/dagster_home
    volumes:
      - ./dagster.yaml:/opt/dagster_home/dagster.yaml:ro
      - ./workspace.yaml:/opt/dagster_home/workspace.yaml:ro
      - dagster_home:/opt/dagster_home
      - dbt_target:/opt/app/dbt/target   # share dbt docs (manifest/catalog) with the dbt-docs server
    ports: ["3000:3000"]

  dagster-daemon:
    build: { context: ., dockerfile: Dockerfile }
    image: fx-macro-platform:latest
    command: dagster-daemon run
    depends_on:
      postgres: { condition: service_healthy }
    environment: *dagster-env
    volumes:
      - ./dagster.yaml:/opt/dagster_home/dagster.yaml:ro
      - ./workspace.yaml:/opt/dagster_home/workspace.yaml:ro
      - dagster_home:/opt/dagster_home
      - dbt_target:/opt/app/dbt/target   # share dbt docs (manifest/catalog) with the dbt-docs server

  api:
    build: { context: ., dockerfile: Dockerfile }
    image: fx-macro-platform:latest
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: warehouse
      PLATFORM_READER_USER: platform_reader
      PLATFORM_READER_PASSWORD: ${PLATFORM_READER_PASSWORD:-reader_dev}
    ports: ["8000:8000"]

  dashboard:
    build: { context: ./dashboard, dockerfile: Dockerfile }
    image: fx-macro-dashboard:latest
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: warehouse
      PLATFORM_READER_USER: platform_reader
      PLATFORM_READER_PASSWORD: ${PLATFORM_READER_PASSWORD:-reader_dev}
    ports: ["8501:8501"]   # Streamlit forecasting studio
    restart: unless-stopped

  metabase:
    image: metabase/metabase
    volumes:
      - metabase_data:/metabase-data
    ports: ["3001:3000"]
    # Metabase's own metadata stays on its embedded H2 (in metabase_data).
    # Add the warehouse as a data source in the UI:
    #   PostgreSQL  host=postgres port=5432  db=warehouse
    #   user=platform_reader  password=reader_dev

  launchpad:
    image: nginx:alpine
    volumes:
      - ./launchpad:/usr/share/nginx/html:ro
    ports: ["8080:80"]   # dev navigation hub -> links to the services above

  elementary-report:
    image: fx-macro-platform:latest
    command: bash /opt/app/scripts/elementary_serve.sh
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: warehouse
      PLATFORM_WRITER_USER: platform_writer
      PLATFORM_WRITER_PASSWORD: ${PLATFORM_WRITER_PASSWORD:-writer_dev}
    ports: ["8081:8081"]   # Elementary observability report

  dbt-deps-report:
    image: fx-macro-platform:latest
    command: python /opt/app/scripts/dbt_deps_report.py
    environment:
      DBT_DEPS_REPORT_DIR: /reports
      DBT_DEPS_PORT: "8082"
      DBT_DEPS_REFRESH_SECONDS: "300"
    volumes:
      - ./scripts/dbt_deps_report.py:/opt/app/scripts/dbt_deps_report.py:ro
      - ./dbt:/opt/app/dbt
      - ./reports/dbt-deps:/reports
    ports: ["8082:8082"]   # dbt deps install report

  dbt-docs:
    image: fx-macro-platform:latest
    command: sh -c "mkdir -p /opt/app/dbt/target && python -m http.server 8083 --bind 0.0.0.0 --directory /opt/app/dbt/target"
    volumes:
      - dbt_target:/opt/app/dbt/target
    ports: ["8083:8083"]   # dbt lineage DAG + catalog (refreshed by every build)

volumes:
  pgdata:
  dagster_home:
  metabase_data:
  dbt_target:
