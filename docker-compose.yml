services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-warehouse}
      PLATFORM_WRITER_PASSWORD: ${PLATFORM_WRITER_PASSWORD:-writer_dev}
      PLATFORM_READER_PASSWORD: ${PLATFORM_READER_PASSWORD:-reader_dev}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"   # 5433: host has a local Postgres on 5432. Removed in prod (spec §14).
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-warehouse}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
