<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FX Macro — Control Plane</title>
<link rel="stylesheet" href="design-system/design-system.css" />
</head>
<body>
  <div class="ambient" aria-hidden="true">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
  </div>

  <main class="stage">
    <div class="grid" id="grid"></div>
  </main>

  <script src="design-system/design-system.js"></script>
  <script>
  // ---------------------------------------------------------------
  // Page content (kept here on purpose — this is configuration, not
  // the design system). Add a service = add one object here.
  // Keep href/health in sync with docker-compose.yml (host ports).
  // ---------------------------------------------------------------
  const TILES = [
    { name: "Dagster",    role: "Orchestration · lineage · runs", icon: "layers",   href: "http://127.0.0.1:3000",      health: "http://127.0.0.1:3000" },
    { name: "API",        role: "FastAPI · OpenAPI docs",          icon: "terminal", href: "http://127.0.0.1:8000/docs", health: "http://127.0.0.1:8000/health" },
    { name: "Metabase",   role: "Exploratory BI",                  icon: "chart",    href: "http://127.0.0.1:3001",      health: "http://127.0.0.1:3001/api/health" },
    { name: "CloudBeaver",role: "SQL workbench · DB browser",      icon: "database", href: "http://127.0.0.1:8978",      health: "http://127.0.0.1:8978" },
    { name: "Elementary", role: "Data-quality report (edr)",       icon: "activity", href: "http://127.0.0.1:8081",      health: "http://127.0.0.1:8081" },
    { name: "dbt docs",   role: "Lineage · dbt DAG",               icon: "graph",    href: "http://127.0.0.1:8083",      health: "http://127.0.0.1:8083" },
    { name: "Dashboard",  role: "Streamlit · forecast studio",     icon: "forecast", href: "http://127.0.0.1:8501",      health: "http://127.0.0.1:8501/_stcore/health" },
  ];

  const ICONS = {
    layers:   `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 2 7l10 5 10-5-10-5Z"/><path d="m2 12 10 5 10-5"/><path d="m2 17 10 5 10-5"/></svg>`,
    chart:    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>`,
    terminal: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"/><line x1="12" x2="20" y1="19" y2="19"/></svg>`,
    activity: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>`,
    rocket:   `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09Z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2Z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/></svg>`,
    package:  `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="M3.3 7 12 12l8.7-5"/><path d="M12 22V12"/></svg>`,
    graph:    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="5" r="2.5"/><circle cx="19" cy="5" r="2.5"/><circle cx="12" cy="19" r="2.5"/><path d="M7.5 6.5h9M6.6 7.2 10.9 17M17.4 7.2 13.1 17"/></svg>`,
    forecast: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>`,
    database: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14a9 3 0 0 0 18 0V5"/><path d="M3 12a9 3 0 0 0 18 0"/></svg>`,
  };

  const grid = document.getElementById("grid");
  const DEMO = new URLSearchParams(location.search).has("demo");

  TILES.forEach((t, i) => {
    const el = document.createElement("a");
    el.className = "tile";
    el.setAttribute("data-tilt", "");
    el.style.setProperty("--i", i);
    el.href = t.href;
    el.target = "_blank";
    el.rel = "noopener";

    el.innerHTML = `
      <div class="icon">${ICONS[t.icon]}</div>
      <div class="meta">
        <div class="name">${t.name}</div>
        <div class="role">${t.role}</div>
      </div>
      <div class="status" data-state="checking"><span class="dot"></span><span class="label">checking</span></div>
    `;

    grid.appendChild(el);
    FXMacro.initTilt(el);

    const statusEl = el.querySelector(".status");
    if (DEMO || !t.health) {
      if (t.health) setState(statusEl, "online", "live");
      else setState(statusEl, "online", "external");
    } else {
      check(t.health).then((up) => setState(statusEl, up ? "online" : "offline", up ? "live" : "offline"));
    }
  });

  function setState(el, state, label) {
    el.dataset.state = state;
    el.querySelector(".label").textContent = label;
  }

  async function check(url, timeout = 2500) {
    const c = new AbortController();
    const t = setTimeout(() => c.abort(), timeout);
    try {
      await fetch(url, { mode: "no-cors", cache: "no-store", signal: c.signal });
      return true;
    } catch {
      return false;
    } finally {
      clearTimeout(t);
    }
  }
  </script>
</body>
</html>
